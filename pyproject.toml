[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaihou-engine"
version = "0.2.0"
description = "Orchestration layer for Kaihou NLP Engine and related pipelines"
readme = "README.md"
authors = [{name = "Houtarou", email = "houtarou@example.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click",
    "pydantic>=2.0",
    "pyyaml",
    "httpx",
    "spacy>=3.7",
    "rich>=13.0",
    "numpy",
    "torch",
    "sentence-transformers"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
kaihou = "kaihou_engine.orchestrator:main"
